---
Name: dynamic-edgecache-middleware
Before:
  - '#requestprocessors'
---
# Outside core's cache-control middleware, so it sees the final Cache-Control.
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        EdgeCacheMiddleware: '%$Dynamic\EdgeCache\Middleware\EdgeCacheMiddleware'
---
Name: dynamic-edgecache-cache
---
# Throttles the "page is over the tag limit" warning to once an hour per URL.
SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.EdgeCache:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: 'EdgeCache'
      defaultLifetime: 3600

  # Purges the CDN refused, kept for a retry (see Purge\PurgeBacklog). A plain filesystem pool, not the
  # default cache factory: Versioned wraps that one and keys every entry by reading mode (the CMS, the
  # front end and sake would each see a different backlog), and it may store entries as PHP files read
  # through opcache, which the CLI and FPM do not share. No expiry here; items expire in code.
  Dynamic\EdgeCache\BacklogPool:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    constructor:
      namespace: 'EdgeCachePurgeBacklog'
      defaultLifetime: 0
      directory: '`TEMP_PATH`'
  Psr\SimpleCache\CacheInterface.EdgeCachePurgeBacklog:
    class: Symfony\Component\Cache\Psr16Cache
    constructor:
      pool: '%$Dynamic\EdgeCache\BacklogPool'
