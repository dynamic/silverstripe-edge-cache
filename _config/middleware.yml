---
Name: dynamic-edgecache-middleware
Before:
  - '#requestprocessors'
---
# Outside core's cache-control middleware, so it sees the final Cache-Control.
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        EdgeCacheMiddleware: '%$Dynamic\EdgeCache\Middleware\EdgeCacheMiddleware'
---
Name: dynamic-edgecache-cache
---
# Throttles the "page is over the tag limit" warning to once an hour per URL.
SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.EdgeCache:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: 'EdgeCache'
      defaultLifetime: 3600

  # Purges the CDN refused, kept for a retry (see Purge\PurgeBacklog). A plain filesystem cache: the
  # default factory is wrapped by Versioned, which keys every entry by reading mode, and the CMS, the
  # front end and sake would each see a different backlog. No in-memory layer, so another process reads
  # what a web request stored. Items expire in code, not here.
  Dynamic\EdgeCache\BacklogCacheFactory:
    class: SilverStripe\Core\Cache\DefaultCacheFactory
    constructor:
      args:
        directory: '`TEMP_PATH`'
      logger: '%$Psr\Log\LoggerInterface'
  Psr\SimpleCache\CacheInterface.EdgeCachePurgeBacklog:
    factory: Dynamic\EdgeCache\BacklogCacheFactory
    constructor:
      namespace: 'EdgeCachePurgeBacklog'
      defaultLifetime: 0
      useInMemoryCache: false
