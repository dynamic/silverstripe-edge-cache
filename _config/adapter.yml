#   SilverStripe\Core\Injector\Injector:
#     Dynamic\EdgeCache\Adapter\EdgeCacheAdapter:
#       class: Dynamic\EdgeCache\Adapter\CloudflareAdapter
SilverStripe\Core\Injector\Injector:
  Dynamic\EdgeCache\Adapter\EdgeCacheAdapter:
    class: Dynamic\EdgeCache\Adapter\NullAdapter
